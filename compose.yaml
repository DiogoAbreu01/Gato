# Gato production compose: ALL persistent data remains in cloud services.
# Explicitly no PostgreSQL container: use external Neon DATABASE_URL.
services:
  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a Neon PostgreSQL connection URI}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a Neon PostgreSQL connection URI}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      SESSION_COOKIE_NAME: gato_session
      STORAGE_DIR: /srv/atletica/storage
    volumes:
      - uploads:/srv/atletica/storage
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your publicly-resolvable domain name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  uploads:
  caddy_data:
  caddy_config:
