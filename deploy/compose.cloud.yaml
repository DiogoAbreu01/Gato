# Production deployment: Next.js + external Neon Postgres + Caddy on Oracle VM.
# Do not run PostgreSQL on the developer's computer.
services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL_UNPOOLED:-${DATABASE_URL:?Configure DATABASE_URL Neon no .env}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    command: ["npx", "prisma", "migrate", "deploy"]
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL Neon no .env}
      APP_URL: ${APP_URL:?Configure APP_URL HTTPS no .env}
      STORAGE_DIR: /srv/atletica/storage
      SESSION_COOKIE_NAME: gato_session
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/srv/atletica/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  uploads:
  caddy_data:
  caddy_config:
